schema: spec-driven

# Shown to the AI before it names a change or writes artifacts.
context: |
  Разработка ведётся на C++20. Новый код пиши на C++20 и не ограничивай его
  подмножеством более старого стандарта, если задача прямо не требует иной
  совместимости.

  Имя OpenSpec-изменения должно совпадать с именем git-ветки.
  Допустимое имя имеет формат kebab-case: состоит из строчных латинских
  букв и цифр, разделённых одиночными дефисами. Слеши, подчёркивания,
  точки, пробелы, заглавные буквы, начальные и конечные дефисы запрещены.
  Примеры допустимых имён: add-export-queue и fix-retry-timeout.

  Перед созданием OpenSpec-изменения выбери имя в следующем порядке:
  1. Определи имя текущей git-ветки. Если HEAD отсоединён или имя ветки
     определить невозможно, не создавай изменение и запроси решение пользователя.
  2. Если пользователь явно указал имя изменения, проверь его на kebab-case.
     Невалидное имя не исправляй молча: объясни проблему предложи исправление
     и запроси подтверждение пользователя.
  3. Если текущая ветка — Master, используй явно указанное допустимое имя
     как кандидат или предложи имя самостоятельно. Дождись явного подтверждения,
     затем сначала создай ветку и только после этого создавай изменение.
  4. Если текущая ветка отличается от Master и имеет допустимое имя, используй
     её имя. Если пользователь явно указал другое имя, не создавай изменение,
     пока он не выберет создание, переименование или переключение ветки.
  5. Если имя текущей ветки не соответствует kebab-case, не создавай изменение.
     Объясни проблему, предложи допустимое имя и дождись явного подтверждения
     перед созданием новой ветки или переименованием текущей.
  План хранится в openspec/changes/<имя-ветки>/.

  Окончания строк задаёт .gitattributes (`* text=auto`). Не перенормализуй
  generated и vendor-файлы. При точечной правке не меняй окончания строк
  у несвязанных файлов.

  Перед созданием новых файлов согласуй нестандартные имена и пути,
  если пользователь ещё не указал точное имя или путь. Указанное пользователем
  имя или путь считай согласованным.
  Стандартные имена файлов, например .gitignore и CMakeLists.txt,
  не требуют согласования.


# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - Пиши основной текст proposal.md на русском, сохраняя структуру шаблона OpenSpec.
  specs:
    - Пиши требования и сценарии на русском, сохраняя обязательные заголовки и формат OpenSpec.
  design:
    - Пиши основной текст design.md на русском, сохраняя структуру шаблона OpenSpec.
  tasks:
    - Пиши основной текст tasks.md (заголовки секций, описания пунктов и проверки) на русском, сохраняя структуру шаблона OpenSpec.
    - Имена файлов, классов, методов, идентификаторов и литералы из кода оставляй как в исходниках.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - При баге, падении теста или неожиданном поведении сначала читай и следуй скиллу systematic-debugging. Не чини вслепую.
      - Для новых правок по возможности читай и следуй скиллу test-driven-development.
      - Перед заявлением о готовности читай и следуй скиллу verification-before-completion.
      - При разборе комментариев ревью проверяй каждое замечание по коду и требованиям и не соглашайся автоматически. Исправляй проблемы, подтверждённые анализом. Если замечание меняет scope, публичное поведение или требует выбора, сначала запроси решение пользователя.
      - Перед правкой C++ читай и следуй скиллу cpp-code-style. Стандарт проекта — C++20.
